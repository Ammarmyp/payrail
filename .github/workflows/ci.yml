name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.15.0

    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: payrail
                    POSTGRES_PASSWORD: payrail
                    POSTGRES_DB: payrail_test
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U payrail -d payrail_test"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        env:
            TEST_DATABASE_URL: postgres://payrail:payrail@localhost:5432/payrail_test?sslmode=disable
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - run: go vet ./...
            - run: go test -race -cover ./...
