version: "3"

dotenv: [".env"]

vars:
  COMPOSE: docker compose --env-file .env -f deployments/docker-compose.yml

tasks:
  api:
    desc: Run the API once (no hot reload )
    cmds: ["go run ./cmd/api"]
  up:
    desc: Start Postgres and Redis
    cmds: ["{{.COMPOSE}} up -d"]
  down:
    desc: Stop containers (data kept)
    cmds: ["{{.COMPOSE}} down"]
  reset:
    desc: Stop containers and DELETE all data
    prompt: This deletes the database volumes. Continue?
    cmds: ["{{.COMPOSE}} down -v"]
  ps:
    cmds: ["{{.COMPOSE}} ps"]
  logs:
    cmds: ["{{.COMPOSE}} logs -f"]
  psql:
    desc: Open a psql shell
    cmds: ["{{.COMPOSE}} exec postgres psql -U payrail -d payrail"]
  run:
    desc: Run the API with hot reload
    cmds: ["air"]
  build:
    desc: Build the API binary into bin/
    cmds: ["go build -o bin/api.exe ./cmd/api"]
  test:
    desc: Run tests
    cmds: ["go test -cover ./..."]
  vet:
    desc: Run go vet
    cmds: ["go vet ./..."]
  lint:
    desc: Run golangci-lint
    cmds: ["golangci-lint run"]
  fmt:
    desc: Format code
    cmds: ["golangci-lint fmt."]
  fmt:check:
    desc: Fail if any file is not formatted
    cmds: ["golangci-lint fmt --diff"]
  tidy:
    cmds: ["go mod tidy"]
  test:cover:
    desc: Open an HTML coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out
  check:
    desc: Everything CI runs, locally. Run before every push.
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test

  #----database migrations----

  migrate:create:
    desc: "Create a migration: task migrate:create -- add_ledger"
    cmds: ["migrate create -ext sql -dir db/migrations -seq {{.CLI_ARGS}}"]
  migrate:up:
    desc: Apply all pending migrations
    preconditions:
      - sh: test -n "$DATABASE_URL"
        msg: DATABASE_URL is not set. Check your .env file.
    cmds: ['migrate -path db/migrations -database "$DATABASE_URL" up']
  migrate:down:
    desc: Roll back one migration
    preconditions:
      - sh: test -n "$DATABASE_URL"
        msg: DATABASE_URL is not set. Check your .env file.
    cmds: ['migrate -path db/migrations -database "$DATABASE_URL" down 1']
  migrate:version:
    desc: Show the current migration version
    cmds: ['migrate -path db/migrations -database "$DATABASE_URL" version']
